<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link ChatGPT</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      text-align:center;
      width:350px;
    }

    a{
      display:inline-block;
      margin-top:15px;
      padding:12px 20px;
      background:#10a37f;
      color:white;
      text-decoration:none;
      border-radius:10px;
      transition:0.3s;
    }

    a:hover{
      background:#0e8c6d;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Open ChatGPT Link</h2>
    <p>Klik tombol di bawah untuk membuka chat.</p>

    <a href="https://chatgpt.com/c/6a13e94a-c7b0-83ec-bb52-3cce00e6bef6" target="_blank">
      Buka Chat
    </a>
  </div>

</body>
</html>
